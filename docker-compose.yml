services:
  db:
    image: postgres:16-alpine
    container_name: motokare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: motokare
      POSTGRES_USER: motokare
      # For LOCAL development only. Change credentials before external deployment.
      POSTGRES_PASSWORD: motokare_local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - motokare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motokare -d motokare"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  motokare_pgdata: